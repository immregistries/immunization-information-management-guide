name: Build MkDocs site
description: Set up Python, install documentation dependencies, and build the site.

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Install dependencies
      shell: bash
      run: pip install -r requirements.txt

    - name: Build site
      shell: bash
      run: mkdocs build --strict
